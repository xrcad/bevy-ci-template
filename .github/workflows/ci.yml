name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  BINARY: bevy_ci_template

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Desktop / Linux build ────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release --bin ${{ env.BINARY }}

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-linux-x86_64
          path: target/release/${{ env.BINARY }}
          if-no-files-found: error

  # ── WASM / WebGPU build ──────────────────────────────────────────────────────
  build-wasm:
    name: Build WASM (WebGPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-bindgen-cli (version-locked to Cargo.lock)
        run: |
          version=$(cargo metadata --format-version 1 \
            | jq --raw-output '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install -f wasm-bindgen-cli --version "$version"

      - name: Build WASM (WebGPU, no default features)
        run: |
          cargo build --release \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features wasm \
            --bin ${{ env.BINARY }}

      - name: Generate JS bindings
        run: |
          wasm-bindgen \
            --no-typescript \
            --out-name bevy_game \
            --out-dir wasm-out \
            --target web \
            target/wasm32-unknown-unknown/release/${{ env.BINARY }}.wasm
          cp wasm/index.html wasm-out/

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-wasm
          path: wasm-out/
          if-no-files-found: error

  # ── GitHub Pages deployment ───────────────────────────────────────────────────
  # Deploys the WASM bundle to GitHub Pages on every successful build-wasm run.
  # Concurrency is scoped to this job only so it does not block other CI jobs.
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-wasm
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY }}-wasm
          path: wasm-out/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wasm-out/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Android APK build ────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 2. Android SDK + NDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      # 3. Rust toolchain + Android target
      - name: Install Rust stable + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}

      # 4. Install cargo-ndk for easy cross-compilation
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 5. Build the Rust shared library for arm64-v8a.
      #    --no-default-features drops bevy/x11; --features android adds GameActivity backend.
      - name: Build Rust cdylib for aarch64-linux-android
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs \
            build --lib --release --no-default-features --features android

      # 6. Assemble debug APK
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      # 7. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
